[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-trading-command-center"
version = "0.1.0"
description = "Evidence-driven crypto trading research foundation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy==2.2.6", "scipy==1.15.3"]
research = ["numpy==2.2.6", "scipy==1.15.3"]
psr01b = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==3.0.6",
  "xgboost==3.4.1",
  "optuna==5.0.0",
  "arch==8.0.0",
  "statsmodels==0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
