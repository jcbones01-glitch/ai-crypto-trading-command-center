name: PSR-01B Bounded Engineering
on:
  push:
    branches: [psr-01b-bounded-implementation]
    paths:
      - 'src/research_core/psr01b_core.py'
      - 'src/research_core/psr01b_features.py'
      - 'src/research_core/psr01b_ta.py'
      - 'src/research_core/psr01b_egarch.py'
      - 'src/research_core/psr01b_model.py'
      - 'src/research_core/psr01b_matrix.py'
      - 'src/research_core/psr01b_benchmarks.py'
      - 'src/research_core/psr01b_preflight.py'
      - 'src/research_core/psr01b_runner.py'
      - 'tests/test_psr01b_core.py'
      - 'tests/test_psr01b_features.py'
      - 'tests/test_psr01b_ta.py'
      - 'tests/test_psr01b_egarch.py'
      - 'tests/test_psr01b_model.py'
      - 'tests/test_psr01b_matrix.py'
      - 'tests/test_psr01b_benchmarks.py'
      - 'tests/test_psr01b_preflight.py'
      - 'tests/test_psr01b_runner.py'
      - '.github/workflows/psr01b-bounded-engineering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -e '.[dev]'
      - name: Install exact PSR-01B runtime additions
        run: pip install pandas==3.0.6 xgboost==3.4.1 optuna==5.0.0 arch==8.0.0 statsmodels==0.15.0
      - name: Verify PSR-01B synthetic numerical core only
        run: python -m pytest -q tests/test_psr01b_core.py tests/test_psr01b_features.py tests/test_psr01b_ta.py tests/test_psr01b_egarch.py tests/test_psr01b_model.py tests/test_psr01b_matrix.py tests/test_psr01b_benchmarks.py tests/test_psr01b_preflight.py tests/test_psr01b_runner.py
      - name: Verify pre-existing AMS-DEP baseline-mismatch files are unchanged
        run: |
          test "$(git hash-object research/governance/ams_dep_release_gate_v1.json)" = "f633b10fadd95e79deee707fac18b5cac5a55bab"
          test "$(git hash-object tests/test_ams_dep_full_pipeline_runner.py)" = "24e5ddfd612e4f47fe326dab8e6ca90858eed2a9"
          test "$(git hash-object research/scripts/run_ams_dep_full_pipeline_integrity.py)" = "75bab7b7346bddea410f31c8f44c281a9e8cba9b"
      - name: Repository regression excluding one pre-existing AMS-DEP fixture mismatch
        run: python -m pytest -q --deselect tests/test_ams_dep_full_pipeline_runner.py::test_valid_authorized_contract_passes
