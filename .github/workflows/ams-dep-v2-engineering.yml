name: AMS-DEP V2 Engineering Only
on:
  push:
    branches: [adaptive-markets-research, ams-dep-v2-calibration-integration]
    paths:
      - 'src/research_core/dependent_wild_bootstrap_v2.py'
      - 'src/research_core/ams_dep_v2_synthetic.py'
      - 'src/research_core/ams_dep_v2_aggregation.py'
      - 'src/research_core/release_gate.py'
      - 'tests/test_dependent_wild_bootstrap_v2.py'
      - 'tests/test_ams_dep_v2_aggregation.py'
      - 'tests/test_ams_dep_v2_calibration_runner.py'
      - 'tests/test_ams_dep_release_gate.py'
      - 'tests/test_ams_dep_v2_shard_planner.py'
      - 'research/scripts/check_ams_dep_v2_engineering.py'
      - 'research/scripts/plan_ams_dep_v2_shards.py'
      - 'research/scripts/run_ams_dep_v2_calibration_shard.py'
      - 'research/scripts/aggregate_ams_dep_v2_calibration.py'
      - 'research/governance/ams_dep_release_gate_v1.json'
      - 'research/governance/ams_dep_v2_freeze_manifest.json'
      - 'research/experiments/ams_dep_synthetic_core_v2.json'
      - 'docs/AMS_DEP_V2*'
      - '.github/workflows/ams-dep-v2-engineering.yml'
      - '.github/workflows/ams-dep-v2-frozen-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -e '.[dev]'
      - name: Full test suite and numerical oracles
        run: python -m pytest
      - name: Bounded engineering resource check
        run: python research/scripts/check_ams_dep_v2_engineering.py
      - name: Build deterministic RNG-free shard plan
        run: python research/scripts/plan_ams_dep_v2_shards.py
      - name: Verify release guards
        run: python -m pytest tests/test_ams_dep_release_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ams-dep-v2-engineering-only
          path: |
            research/experiments/ams_dep_v2_engineering_resource_check.json
            research/experiments/ams_dep_v2_shard_plan.json
          if-no-files-found: error
