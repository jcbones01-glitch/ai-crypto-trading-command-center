name: Gate 1 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - name: Verify Binance historical data
        run: python tests/gate1_binance_verification.py
      - name: Apply Gate 1A data-quality treatment
        run: python tests/gate1a_binance_verification.py
