name: Gate 1 Verification

on:
  workflow_dispatch:

jobs:
  gate1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - name: Verify Binance historical data
        run: python tests/gate1_binance_verification.py
      - name: Apply Gate 1A data-quality treatment
        run: python tests/gate1a_binance_verification.py
      - name: Publish Gate 1A certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate1a-certification-evidence
          path: gate1a_reports/
          if-no-files-found: error
          retention-days: 30
