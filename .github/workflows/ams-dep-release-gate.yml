name: AMS DEP Release Gate

on:
  push:
    branches:
      - adaptive-markets-research
    paths:
      - ".github/workflows/ams-dep-release-gate.yml"
      - "research/governance/ams_dep_release_gate_v1.json"
      - "src/research_core/release_gate.py"
      - "tests/test_ams_dep_release_gate.py"
      - "research/scripts/*ams_dep*empirical*.py"
  pull_request:
    paths:
      - "research/governance/ams_dep_release_gate_v1.json"
      - "src/research_core/release_gate.py"
      - "tests/test_ams_dep_release_gate.py"
      - "research/scripts/*ams_dep*empirical*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify AMS-DEP release lock
        run: pytest -q tests/test_ams_dep_release_gate.py

      - name: Print current authorization state
        run: |
          python - <<'PY'
          from research_core.release_gate import load_ams_dep_release_gate
          g = load_ams_dep_release_gate()
          print("AMS_DEP_GATE_STATUS", g["status"])
          print("V2_SYNTHETIC_AUTHORIZED", g["v2_synthetic_execution_authorized"])
          print("DEVELOPMENT_MARKET_DATA_AUTHORIZED", g["development_market_data_execution_authorized"])
          print("VALIDATION_OOS_AUTHORIZED", g["validation_or_oos_access_authorized"])
          PY
