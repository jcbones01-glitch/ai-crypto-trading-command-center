name: Gate 2 Cycle 5

on:
  push:
    branches: [gate2-research-foundation]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gate2-cycle5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Verify causal timing contract
        run: python -m pytest tests/test_backtesting_execution_delay.py -q
      - name: Run preregistered Cycle 5 Development experiments
        run: CHECKED_OUT_SHA=$(git rev-parse HEAD) GITHUB_SHA=$(git rev-parse HEAD) python tests/gate2_cycle5_experiments.py
      - name: Upload Cycle 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-cycle5-results
          path: gate2_cycle5_results/cycle5_results.json
          if-no-files-found: error
          retention-days: 30
