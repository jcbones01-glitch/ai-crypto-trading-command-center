name: Gate 2 Cycle 9 Derivatives Development Certification

on:
  push:
    branches:
      - gate2-cycle9-market-ecology-data
    paths:
      - ".github/workflows/gate2-cycle9-derivatives-development-certification.yml"
      - "docs/GATE2_CYCLE9_DERIVATIVES_DEVELOPMENT_CERTIFICATION_PROTOCOL_V1.md"
      - "docs/GATE2_CYCLE9_DERIVATIVES_NORMALIZATION_CONTRACT_V1.md"
      - "research/scripts/certify_cycle9_derivatives_development_v1.py"
      - "tests/test_cycle9_derivatives_development_certifier.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit with provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full software regression suite
        run: pytest -q

      - name: Run frozen full-history Development certification
        run: python research/scripts/certify_cycle9_derivatives_development_v1.py

      - name: Verify certification firewall and status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("gate2_cycle9_derivatives_development_results/certification.json")
          d = json.loads(p.read_text())
          assert d["classification"] == "DATA_CERTIFICATION_NOT_TRADING_EVIDENCE"
          assert d["candidate_month_count_per_stream"] == 53
          assert len(d["streams"]) == 4
          assert d["validation_or_oos_accessed"] is False
          assert d["strategy_pnl_calculated"] is False
          assert d["strategy_signals_generated"] is False
          assert d["strategy_thresholds_searched"] is False
          assert d["status"] in {
              "DERIVATIVES_DEVELOPMENT_DATASET_CERTIFIED",
              "DERIVATIVES_DEVELOPMENT_DATASET_CERTIFICATION_FAILED",
          }
          print(d["status"])
          for stream in d["streams"]:
              print(
                  stream["stream"],
                  stream["status"],
                  stream["first_source_native_archive_month"],
                  stream["accepted_archive_count"],
                  stream["normalized_row_count"],
              )
          PY

      - name: Upload Development certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-cycle9-derivatives-development-v1
          path: gate2_cycle9_derivatives_development_results/
          if-no-files-found: error
          retention-days: 90
