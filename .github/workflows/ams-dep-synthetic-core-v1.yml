name: AMS DEP Synthetic Core V1

on:
  push:
    branches:
      - adaptive-markets-research
    paths:
      - ".github/workflows/ams-dep-synthetic-core-v1.yml"
      - "src/research_core/dependence_statistics.py"
      - "research/scripts/run_ams_dep_synthetic_core_v1.py"
      - "research/experiments/ams_dep_synthetic_core_v1.json"
      - "docs/AMS_DEP_NUMERICAL_CONTRACT_V1.md"
      - "docs/AMS_DEP_SYNTHETIC_CALIBRATION_V1.md"
      - "tests/test_dependence_statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact branch commit with provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full software regression suite
        run: pytest -q

      - name: Run fixed synthetic numerical-core calibration
        run: python research/scripts/run_ams_dep_synthetic_core_v1.py

      - name: Enforce synthetic engineering screen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/experiments/ams_dep_synthetic_core_v1_results/summary.json")
          d = json.loads(p.read_text())
          assert d["classification"] == "SYNTHETIC_NUMERICAL_CALIBRATION_NOT_MARKET_EVIDENCE"
          assert d["market_data_accessed"] is False
          assert d["validation_or_oos_accessed"] is False
          assert d["empirical_release_authorized"] is False
          assert d["replicate_count"] == 7000
          if not d["engineering_screen_pass"]:
              raise SystemExit("Synthetic engineering screen failed; empirical release remains blocked.")
          print("SYNTHETIC_CORE_V1_PASS")
          PY

      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-dep-synthetic-core-v1
          path: research/experiments/ams_dep_synthetic_core_v1_results/
          if-no-files-found: error
          retention-days: 90
