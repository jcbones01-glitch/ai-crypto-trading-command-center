name: Gate 2 Next Cycle

on:
  workflow_dispatch:
  push:
    branches: [gate2-research-foundation]
  pull_request:
    branches: [main]

jobs:
  gate2-next-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Causal timing contract
        run: |
          python - <<'PY'
          from decimal import Decimal
          from research_core.backtesting import BacktestConfig
          for delay in (1, 2):
              BacktestConfig(Decimal('1000'), Decimal('0.001'), Decimal('0.0005'), execution_delay_bars=delay)
          for delay in (0, -1, 3):
              try:
                  BacktestConfig(Decimal('1000'), Decimal('0.001'), Decimal('0.0005'), execution_delay_bars=delay)
              except ValueError:
                  continue
              raise SystemExit(f'invalid delay accepted: {delay}')
          print('causal timing contract passed')
          PY
      - name: Run next-cycle experiments
        run: python tests/gate2_next_cycle_experiments.py
      - name: Upload next-cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-next-cycle-results
          path: gate2_next_cycle_results/next_cycle_results.json
          if-no-files-found: error
