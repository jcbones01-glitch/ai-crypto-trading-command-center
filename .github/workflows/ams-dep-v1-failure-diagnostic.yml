name: AMS DEP V1 Failure Diagnostic

on:
  push:
    branches:
      - adaptive-markets-research
    paths:
      - ".github/workflows/ams-dep-v1-failure-diagnostic.yml"
      - "research/scripts/diagnose_ams_dep_v1_failure.py"
      - "research/experiments/ams_dep_v1_failure_diagnostic_v1.json"
      - "docs/AMS_DEP_V1_FAILURE_DIAGNOSTIC_PLAN.md"
      - "src/research_core/dependence_statistics.py"
      - "research/scripts/run_ams_dep_synthetic_core_v1.py"
      - "research/experiments/ams_dep_synthetic_core_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout exact commit with provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full software regression suite
        run: pytest -q

      - name: Run frozen synthetic failure diagnostic
        run: python research/scripts/diagnose_ams_dep_v1_failure.py

      - name: Enforce diagnostic firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/experiments/ams_dep_v1_failure_diagnostic_v1_results/summary.json")
          d = json.loads(p.read_text())
          assert d["classification"] == "SYNTHETIC_DIAGNOSTIC_ONLY"
          assert d["market_data_accessed"] is False
          assert d["validation_or_oos_accessed"] is False
          assert d["strategy_pnl_calculated"] is False
          assert d["strategy_signals_generated"] is False
          assert d["empirical_release_authorized"] is False
          assert d["v1_failure_preserved"] is True
          print("SYNTHETIC_DIAGNOSTIC_FIREWALL_PASS")
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-dep-v1-failure-diagnostic-v1
          path: research/experiments/ams_dep_v1_failure_diagnostic_v1_results/
          if-no-files-found: error
          retention-days: 90
