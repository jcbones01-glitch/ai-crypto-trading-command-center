name: Gate 2 Cycle 9 Derivatives Source Probe

on:
  push:
    branches:
      - gate2-cycle9-market-ecology-data
    paths:
      - ".github/workflows/gate2-cycle9-derivatives-source-probe.yml"
      - "docs/GATE2_CYCLE9_DERIVATIVES_SOURCE_PROBE_PREREGISTRATION_V1.md"
      - "tests/gate2_cycle9_derivatives_source_probe.py"
      - "src/research_core/data_ingestion.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derivatives-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Record checked-out SHA
        run: echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run full software regression suite
        run: pytest -q

      - name: Run frozen Cycle 9 derivatives source probe
        run: python tests/gate2_cycle9_derivatives_source_probe.py

      - name: Verify research firewall fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("gate2_cycle9_derivatives_source_probe_results/cycle9_derivatives_source_probe.json")
          d = json.loads(p.read_text())
          assert d["registered_archive_count"] == 8
          assert d["validation_or_oos_accessed"] is False
          assert d["strategy_pnl_calculated"] is False
          assert d["strategy_signals_generated"] is False
          assert d["status"] in {"DERIVATIVES_SOURCE_PROBE_PASS", "DERIVATIVES_SOURCE_PROBE_FAIL"}
          print(d["status"])
          print(f'PASS_COUNT={d["pass_count"]}/8')
          PY

      - name: Upload source-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-cycle9-derivatives-source-probe-v1
          path: gate2_cycle9_derivatives_source_probe_results/
          if-no-files-found: error
          retention-days: 90
