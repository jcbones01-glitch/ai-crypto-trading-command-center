name: Gate 2 FOMC Descriptive Event Study

on:
  push:
    branches: [gate2-event-intelligence-foundation]
    paths:
      - 'docs/GATE2_FOMC_EVENT_STUDY_PREREGISTRATION_V1.md'
      - 'research/experiments/fomc_development_manifest_v1.json'
      - 'research/scripts/run_fomc_event_study_v1.py'
      - 'tests/test_fomc_event_study_v1.py'
      - '.github/workflows/gate2-fomc-event-study.yml'
  workflow_dispatch:

concurrency:
  group: gate2-fomc-event-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fomc-descriptive-event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run full test suite
        run: pytest
      - name: Verify preregistered event-study mechanics
        run: python -m pytest tests/test_fomc_event_study_v1.py -q
      - name: Run Development-only descriptive event study
        run: GITHUB_SHA=$(git rev-parse HEAD) python research/scripts/run_fomc_event_study_v1.py
      - name: Upload descriptive event-study evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-fomc-event-study-v1
          path: event_intelligence_results/fomc_event_study_v1.json
          if-no-files-found: error
          retention-days: 90
