name: AMS-DEP V2 Holdout Preparation

on:
  pull_request:
    paths:
      - 'docs/AMS_DEP_V2_HOLDOUT_EXECUTION_PLAN.md'
      - 'research/governance/ams_dep_v2_holdout_execution_addendum_v1.json'
      - 'research/governance/ams_dep_v2_holdout_execution_manifest_v1.json'
      - 'src/research_core/release_gate.py'
      - 'src/research_core/ams_dep_v2_holdout_gate.py'
      - 'src/research_core/ams_dep_v2_holdout_bundle.py'
      - 'research/scripts/claim_ams_dep_v2_holdout.py'
      - 'research/scripts/build_ams_dep_v2_holdout_execution_manifest.py'
      - 'research/scripts/run_ams_dep_v2_holdout_shard.py'
      - 'research/scripts/aggregate_ams_dep_v2_holdout.py'
      - 'tests/test_ams_dep_release_gate.py'
      - 'tests/test_ams_dep_v2_holdout_*.py'
      - '.github/workflows/ams-dep-v2-holdout-preflight.yml'
      - '.github/workflows/ams-dep-v2-frozen-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-without-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: pip install -e '.[dev]'
      - name: Verify no frozen V2 file changed
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'research/governance/ams_dep_v2_freeze_manifest.json').read_text())
          for relative,expected in manifest['file_git_blob_sha1'].items():
              actual=subprocess.check_output(['git','hash-object','--',relative],text=True).strip()
              assert actual==expected,(relative,actual,expected)
          print('FROZEN_V2_FILES_UNCHANGED')
          PY
      - name: Run holdout preparation tests
        run: |
          python -m pytest -q \
            tests/test_ams_dep_release_gate.py \
            tests/test_ams_dep_v2_holdout_gate.py \
            tests/test_ams_dep_v2_holdout_claim.py \
            tests/test_ams_dep_v2_holdout_bundle.py \
            tests/test_ams_dep_v2_holdout_runner.py \
            tests/test_ams_dep_v2_holdout_aggregation.py
      - name: Verify holdout authority state without reserved RNG use
        run: |
          python - <<'PY'
          from research_core.ams_dep_v2_holdout_gate import (
              HoldoutAuthorizationError,
              assert_ams_dep_v2_holdout_path_allowed,
              load_holdout_addendum,
          )
          from research_core.release_gate import ResearchGateError, load_ams_dep_release_gate
          gate=load_ams_dep_release_gate()
          addendum=load_holdout_addendum()
          expected_open=(
              gate.get('v2_synthetic_calibration_passed') is True
              and gate.get('v2_holdout_execution_authorized') is True
              and addendum.get('status')=='AUTHORIZED'
              and addendum.get('explicit_holdout_execution_authorized') is True
          )
          try:
              assert_ams_dep_v2_holdout_path_allowed()
          except (HoldoutAuthorizationError, ResearchGateError) as exc:
              if expected_open:
                  raise
              print('HOLDOUT_LOCK_CONFIRMED', exc)
          else:
              if not expected_open:
                  raise SystemExit('Holdout path opened without matching governance state')
              import importlib.util
              from pathlib import Path
              runner_path=Path('research/scripts/run_ams_dep_v2_holdout_shard.py')
              spec=importlib.util.spec_from_file_location('holdout_runner',runner_path)
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              mod._verify_authority()
              print('HOLDOUT_AUTHORITY_AND_EXECUTION_BUNDLE_CONFIRMED')
          PY
