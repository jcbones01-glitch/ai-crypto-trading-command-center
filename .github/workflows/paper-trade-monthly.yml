name: Paper Trade Monthly (fake money only)

# Manual-only for now.  To automate later (owner approval required),
# uncomment the schedule block: it runs on the 1st trading days of each month.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run shows the plan only; submit places PAPER orders'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - submit
#  schedule:
#    - cron: '35 14 1-3 * 1-5'

permissions:
  contents: read

jobs:
  rebalance:
    runs-on: ubuntu-24.04
    env:
      ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
      ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Safety tests
        run: python -m pytest -q tests/test_papertrade.py
      - name: Rebalance (paper only)
        run: |
          if [ "${{ inputs.mode }}" = "submit" ]; then
            python -m papertrade.rebalance --submit
          else
            python -m papertrade.rebalance
          fi
