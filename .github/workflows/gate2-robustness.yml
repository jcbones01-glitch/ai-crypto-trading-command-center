name: Gate 2 Robustness Battery

on:
  workflow_dispatch:

jobs:
  gate2-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Run test suite
        run: pytest
      - name: Verify causal timing contract
        run: |
          python - <<'PY'
          from decimal import Decimal
          from research_core.backtesting import BacktestConfig
          for delay in (1, 2):
              assert BacktestConfig(Decimal("1000"), Decimal("0"), Decimal("0"), delay).execution_delay_bars == delay
          for delay in (0, -1, 3):
              try:
                  BacktestConfig(Decimal("1000"), Decimal("0"), Decimal("0"), delay)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"unsupported execution delay accepted: {delay}")
          print("CAUSAL TIMING CONTRACT: PASS")
          PY
      - name: Run preregistered Development robustness battery
        run: python tests/gate2_robustness_experiments.py
      - name: Publish robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-robustness-results
          path: gate2_robustness_results/robustness_results.json
          if-no-files-found: error
          retention-days: 30
