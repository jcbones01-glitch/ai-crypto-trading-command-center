name: Gate 2 Cycle 2

on:
  workflow_dispatch:
  push:
    branches: [gate2-research-foundation]
  pull_request:
    branches: [main]

jobs:
  gate2-cycle2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Verify causal timing contract
        run: |
          python - <<'PY'
          from decimal import Decimal
          from research_core.backtesting import BacktestConfig
          for d in (1,2): BacktestConfig(Decimal('1000'),Decimal('.001'),Decimal('.0005'),execution_delay_bars=d)
          for d in (0,-1,3):
              try: BacktestConfig(Decimal('1000'),Decimal('.001'),Decimal('.0005'),execution_delay_bars=d)
              except ValueError: continue
              raise SystemExit(f'unsupported delay accepted: {d}')
          print('causal timing contract passed')
          PY
      - name: Run preregistered Cycle 2 Development experiments
        run: python tests/gate2_cycle2_experiments.py
      - name: Upload Cycle 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-cycle2-results
          path: gate2_cycle2_results/cycle2_results.json
          if-no-files-found: error
          retention-days: 30
