name: Gate 2 CPI Development Manifest

on:
  push:
    branches: [gate2-event-intelligence-foundation]
    paths:
      - 'research/sources/bls_cpi_v1/**'
      - 'src/intelligence/sources/bls_cpi.py'
      - 'research/scripts/build_cpi_development_manifest.py'
      - 'tests/test_cpi_development_manifest.py'
      - '.github/workflows/gate2-cpi-development-manifest.yml'
  workflow_dispatch:

concurrency:
  group: gate2-cpi-development-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpi-development-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Verify manifest scope and CPI source parser
        run: python -m pytest tests/test_bls_cpi_source.py tests/test_cpi_development_manifest.py -q
      - name: Generate Development-only CPI manifest
        run: GITHUB_SHA=$(git rev-parse HEAD) python research/scripts/build_cpi_development_manifest.py
      - name: Upload CPI manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-cpi-development-manifest
          path: event_intelligence_results/cpi_development_manifest.json
          if-no-files-found: error
          retention-days: 90
